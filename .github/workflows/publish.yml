name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dist-tag:
        description: "npm dist-tag (latest, next, beta)"
        required: false
        default: "latest"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Verify package contents
        run: npm run pack:dry

      - name: Publish to npm
        env:
          DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs['dist-tag'] || 'latest' }}
        run: npm publish --provenance --access public --tag "$DIST_TAG"
