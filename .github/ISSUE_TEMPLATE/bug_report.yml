name: Bug report
description: Report something that is not working in pi-dependency-safety
title: "bug: "
labels: ["type:bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please search existing issues before opening a new one.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
      placeholder: Describe the bug clearly and briefly.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest steps that reproduce the problem.
      placeholder: |
        1. Install pi-dependency-safety...
        2. Ask Pi to review dependency-impacting work...
        3. See...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      placeholder: "pi --version"
    validations:
      required: false
  - type: input
    id: package-version
    attributes:
      label: pi-dependency-safety version
      placeholder: "npm list -g pi-dependency-safety or project package version"
    validations:
      required: false
  - type: dropdown
    id: install-scope
    attributes:
      label: Install scope
      options:
        - Global
        - Project-local
        - Direct --skill path
        - Not sure
    validations:
      required: false
  - type: textarea
    id: project-context
    attributes:
      label: Project dependency context
      description: Include package manager, lockfile type, private/public repo status, and relevant package names if safe to disclose.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or extra context
      description: Add terminal output, skill report snippets, or anything else that helps debug the issue. Redact private package names if needed.
    validations:
      required: false
