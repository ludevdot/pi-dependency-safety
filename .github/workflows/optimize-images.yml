name: Optimize images

on:
  workflow_dispatch:

jobs:
  optimize-svg:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Optimize SVG images
        run: |
          npm install -g svgo@4.0.0
          find assets -name '*.svg' -print0 2>/dev/null | xargs -0 -r svgo

      - name: Commit optimized SVG images
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: optimize SVG images"
          file_pattern: "assets/**/*.svg"
